# CHANGED: previously provisioned MySQL while the app is hard-wired to the
# PostgreSQL driver/dialect (see application.properties). This compose file
# now provisions PostgreSQL for local development, matching production (Neon).
#
# Local dev credentials below are NON-production defaults, overridable via
# a local .env file (see .env.example). Never point this at the Neon URL.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - springboot-network

  app:
    build: .
    container_name: springboot-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ecommerce
      DB_USERNAME: ${DB_USERNAME:-ecommerce}
      DB_PASSWORD: ${DB_PASSWORD:-ecommerce}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set, e.g. via a local .env file}
      PORT: 8080
    networks:
      - springboot-network

networks:
  springboot-network:

volumes:
  postgres_data:
