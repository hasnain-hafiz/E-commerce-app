spring.application.name=E-commerce-app

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USERNAME:ecommerce}
spring.datasource.password=${DB_PASSWORD:ecommerce}

spring.datasource.driver-class-name=org.postgresql.Driver

# CHANGED: was ddl-auto=update (Hibernate silently altering the schema, no
# migration history, risky in production). Flyway now owns schema changes;
# Hibernate only validates that the entities match what Flyway created.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# NEW: Flyway migrations live in src/main/resources/db/migration.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# CHANGED: was "*", which combined with the previous permitAll() security
# rule exposed every actuator endpoint (env, beans, etc.) unauthenticated.
# Now only health/info are exposed by Spring Boot's own endpoint config;
# SecurityConfig additionally requires ROLE_ADMIN for anything under
# /actuator/** except /actuator/health.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

jwt.secret=${JWT_SECRET}
server.port=${PORT:8080}
api.prefix=/api/v1

# NEW: externalized CORS origins (see SecurityConfig). Defaults match the
# previous hardcoded values so behavior is unchanged unless overridden.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://ecommerce-frontend-sigma-lilac.vercel.app}
