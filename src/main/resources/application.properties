spring.application.name=E-commerce-app

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Actuator locked down: only /actuator/health is public (no details), everything
# else requires ADMIN (see SecurityConfig) and health details are hidden from
# anonymous callers so uptime checks work without leaking internals.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secret=${JWT_SECRET}
jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY_MS:900000}
jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY_MS:604800000}

# Cookie flags. Frontend and backend are on different domains in this app's
# deployment (Vercel + separate API host), so cookies are cross-site and MUST
# use SameSite=None + Secure=true or the browser will silently drop them.
# Only relax to Lax/false if you serve both from the same origin (e.g. local
# dev through a Vite proxy).
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:None}

# Comma-separated list of allowed browser origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# AI provider (see Ecommerce.ai package) - falls back to rule-based behavior when unset.
ai.provider=${AI_PROVIDER:openai}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gpt-4o-mini}
ai.enabled=${AI_ENABLED:false}

server.port=${PORT:8080}
api.prefix=/api/v1
